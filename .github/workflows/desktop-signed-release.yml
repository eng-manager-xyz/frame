name: Desktop signed release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact main commit to package
        required: true
        type: string
      version:
        description: Stable semver release (for example 1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-signed-release
  cancel-in-progress: false
  queue: max

jobs:
  authorize:
    name: Authorize immutable desktop release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.scope.outputs.release_sha }}
      version: ${{ steps.scope.outputs.version }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject moving, non-main, or noncanonical inputs
        id: scope
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! $RELEASE_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [[ ! $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be canonical stable semver" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Prove updater packaging and routing contracts
        run: |
          python3 -I scripts/ci/package-desktop-update.py --self-test
          cargo test --locked -p frame-control-plane desktop_update

  macos:
    name: Build signed and notarized macOS updater
    needs: authorize
    runs-on: frame-macos-hardware
    environment: desktop-release
    timeout-minutes: 90
    steps:
      - name: Check out the authorized commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          persist-credentials: false
      - name: Install the declared toolchain and pinned bundlers
        shell: bash
        run: |
          rustup toolchain install 1.96.1 --profile minimal --target wasm32-unknown-unknown
          cargo install trunk --version 0.21.14 --locked
          cargo install tauri-cli --version 2.11.4 --locked
      - name: Require protected signing authority
        shell: bash
        env:
          FRAME_TAURI_UPDATER_PUBLIC_KEY: ${{ vars.FRAME_TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.FRAME_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.FRAME_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.FRAME_APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.FRAME_EXPECTED_APPLE_TEAM_ID }}
        run: |
          test -n "$FRAME_TAURI_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          [[ $APPLE_TEAM_ID =~ ^[A-Z0-9]{10}$ ]]
      - name: Build the exact signed updater artifact
        working-directory: apps/desktop
        shell: bash
        env:
          FRAME_TAURI_UPDATER_PUBLIC_KEY: ${{ vars.FRAME_TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.FRAME_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.FRAME_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.FRAME_APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.FRAME_EXPECTED_APPLE_TEAM_ID }}
          VERSION: ${{ needs.authorize.outputs.version }}
        run: >-
          cargo tauri build --ci --bundles app
          --features macos-native,custom-protocol
          --config tauri.updater.conf.json
          --config "{\"version\":\"${VERSION}\"}"
      - name: Verify the distributed identity and package R2 payload
        shell: bash
        env:
          FRAME_CODESIGN_IDENTITY: ${{ secrets.FRAME_CODESIGN_IDENTITY }}
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          scripts/ci/sign-macos-local-app.sh verify-trusted
          artifact="$(find target/release/bundle/macos -maxdepth 1 -type f -name '*.app.tar.gz' -print)"
          test "$(printf '%s\n' "$artifact" | grep -c .)" = 1
          test -f "$artifact.sig"
          case "$(rustc -vV | sed -n 's/^host: //p')" in
            aarch64-apple-darwin) arch=aarch64 ;;
            x86_64-apple-darwin) arch=x86_64 ;;
            *) echo "unsupported macOS release architecture" >&2; exit 1 ;;
          esac
          python3 -I scripts/ci/package-desktop-update.py \
            --target darwin --arch "$arch" --bundle app --version "$VERSION" \
            --artifact "$artifact" --signature "$artifact.sig" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output target/update-payload
      - name: Retain the exact macOS updater payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-update-macos-${{ needs.authorize.outputs.release_sha }}
          path: target/update-payload
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Build signed Windows updater
    needs: authorize
    runs-on: frame-windows-hardware
    environment: desktop-release
    timeout-minutes: 90
    steps:
      - name: Check out the authorized commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          persist-credentials: false
      - name: Install the declared toolchain and pinned bundlers
        shell: bash
        run: |
          rustup toolchain install 1.96.1 --profile minimal --target wasm32-unknown-unknown
          cargo install trunk --version 0.21.14 --locked
          cargo install tauri-cli --version 2.11.4 --locked
      - name: Create the public Windows signing overlay
        shell: bash
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
          THUMBPRINT: ${{ vars.FRAME_WINDOWS_CERTIFICATE_THUMBPRINT }}
          TIMESTAMP_URL: ${{ vars.FRAME_WINDOWS_TIMESTAMP_URL }}
          FRAME_TAURI_UPDATER_PUBLIC_KEY: ${{ vars.FRAME_TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$FRAME_TAURI_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          [[ $THUMBPRINT =~ ^[A-F0-9]{40}$ ]]
          [[ $TIMESTAMP_URL =~ ^https:// ]]
          mkdir -p target
          python3 -c 'import json,os,pathlib; pathlib.Path("target/desktop-windows-release.json").write_text(json.dumps({"version":os.environ["VERSION"],"bundle":{"windows":{"certificateThumbprint":os.environ["THUMBPRINT"],"digestAlgorithm":"sha256","timestampUrl":os.environ["TIMESTAMP_URL"]}}}), encoding="utf-8")'
      - name: Build the exact signed updater artifact
        working-directory: apps/desktop
        shell: bash
        env:
          FRAME_TAURI_UPDATER_PUBLIC_KEY: ${{ vars.FRAME_TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          cargo tauri build --ci --bundles nsis
          --features windows-native,custom-protocol
          --config tauri.updater.conf.json
          --config ../../target/desktop-windows-release.json
      - name: Verify Authenticode and package R2 payload
        shell: bash
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          artifact="$(find target/release/bundle/nsis -maxdepth 1 -type f -name '*-setup.exe' -print)"
          test "$(printf '%s\n' "$artifact" | grep -c .)" = 1
          test -f "$artifact.sig"
          powershell.exe -NoProfile -Command '$s=Get-AuthenticodeSignature $args[0]; if($s.Status -ne "Valid"){exit 1}' "$artifact"
          case "$(rustc -vV | sed -n 's/^host: //p')" in
            aarch64-pc-windows-msvc) arch=aarch64 ;;
            x86_64-pc-windows-msvc) arch=x86_64 ;;
            *) echo "unsupported Windows release architecture" >&2; exit 1 ;;
          esac
          python3 -I scripts/ci/package-desktop-update.py \
            --target windows --arch "$arch" --bundle nsis --version "$VERSION" \
            --artifact "$artifact" --signature "$artifact.sig" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output target/update-payload
      - name: Retain the exact Windows updater payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-update-windows-${{ needs.authorize.outputs.release_sha }}
          path: target/update-payload
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable updater objects to R2
    needs: [authorize, macos, windows]
    runs-on: ubuntu-24.04
    environment: desktop-release
    timeout-minutes: 20
    steps:
      - name: Download the independently signed payloads
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: desktop-update-*-${{ needs.authorize.outputs.release_sha }}
          path: target/update-payload
          merge-multiple: true
      - name: Require protected R2 publication authority
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FRAME_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FRAME_R2_SECRET_ACCESS_KEY }}
          FRAME_R2_ACCOUNT_ID: ${{ secrets.FRAME_R2_ACCOUNT_ID }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          [[ $FRAME_R2_ACCOUNT_ID =~ ^[a-f0-9]{32}$ ]]
      - name: Publish versioned objects before mutable pointers
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FRAME_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FRAME_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          FRAME_R2_ACCOUNT_ID: ${{ secrets.FRAME_R2_ACCOUNT_ID }}
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          endpoint="https://${FRAME_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          while IFS= read -r artifact; do
            key="${artifact#target/update-payload/}"
            checksum="$(openssl dgst -sha256 -binary "$artifact" | openssl base64 -A)"
            if ! aws s3api put-object \
              --endpoint-url "$endpoint" \
              --bucket frame-recordings --key "$key" --body "$artifact" \
              --content-type application/octet-stream \
              --checksum-sha256 "$checksum" --if-none-match '*'; then
              existing="$(mktemp)"
              aws s3api get-object --endpoint-url "$endpoint" \
                --bucket frame-recordings --key "$key" "$existing"
              cmp "$artifact" "$existing"
            fi
          done < <(find target/update-payload -type f -path "*/${VERSION}/artifact" -print | sort)
          while IFS= read -r pointer; do
            key="${pointer#target/update-payload/}"
            current="$(mktemp)"
            if aws s3api get-object --endpoint-url "$endpoint" \
              --bucket frame-recordings --key "$key" "$current"; then
              python3 -c 'import json,os,sys; old=tuple(map(int,json.load(open(sys.argv[1]))["version"].split("."))); new=tuple(map(int,os.environ["VERSION"].split("."))); sys.exit(0 if new >= old else 1)' "$current"
            fi
            aws s3api put-object --endpoint-url "$endpoint" \
              --bucket frame-recordings --key "$key" --body "$pointer" \
              --content-type application/json \
              --cache-control "public,max-age=60,no-transform"
          done < <(find target/update-payload -type f -name latest.json -print | sort)
      - name: Retain the published pointer set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-update-published-${{ needs.authorize.outputs.release_sha }}
          path: target/update-payload/**/latest.json
          if-no-files-found: error
          retention-days: 90
